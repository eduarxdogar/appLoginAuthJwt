<mat-toolbar color="primary">
  <h1>Sistema De Ventas</h1>
</mat-toolbar>

<mat-drawer-container class="global-content" fxFlexFill>
  <mat-drawer #drawer mode="side" opened>
    <mat-nav-list>
      <a mat-list-item [routerLink]="['/home']">Inicio</a>
      <a mat-list-item [routerLink]="['/cliente']">Cliente</a>
      <a mat-list-item [routerLink]="['/venta']">Venta</a>
      <a mat-list-item (click)="logout()" *ngIf="usuario">Cerrar sesión</a>
    </mat-nav-list>
  </mat-drawer>

  <mat-drawer-content>
    <router-outlet></router-outlet>
  </mat-drawer-content>
</mat-drawer-container>
